<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مِداد | MIDAD</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f4ecdf;
      color: #30271f;
      text-align: center;
    }

    header {
      background: #fffaf2;
      padding: 25px 20px;
      border-bottom: 1px solid #d8c8b3;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      color: #765536;
    }

    .english {
      font-size: 15px;
      letter-spacing: 5px;
      margin-top: 5px;
      color: #a88455;
    }

    main {
      padding: 80px 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 20px;
      color: #2b211b;
    }

    p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #795a3d;
      color: white;
      padding: 14px 30px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
    }

    footer {
      margin-top: 80px;
      padding: 20px;
      background: #2b211b;
      color: #efe7d8;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">مِداد</div>
    <div class="english">MIDAD</div>
  </header>

  <main>
    <h1>مِداد | MIDAD</h1>
    <p>من التفاصيل تبدأ الحكاية</p>

    <a class="btn" href="#">
      متجر مِداد
    </a>
  </main>

  <footer>
    مِداد — لأن التفاصيل هي التي تترك الأثر.
  </footer>

</body>
</html>
